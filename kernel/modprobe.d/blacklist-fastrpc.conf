# SLPI's fastrpc channel returns EINVAL from probe on xiaomi-elish.
# rpmsg then calls rpmsg_destroy_ept from inside that probe, deadlocking
# device_del while the device lock is still held. The udev worker remains
# in D state for the whole boot and hangs systemd-shutdown.
# Audio uses qcom,apr, not fastrpc. Also ensure fastrpc.ko is excluded from initramfs.
blacklist fastrpc
install fastrpc /bin/true
