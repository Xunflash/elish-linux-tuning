# Keep WebKitGTK GPU accelerated compositing enabled on Wayland while using
# SHM frame transport to avoid Adreno 650 freedreno DMA-BUF UBWC UCHE
# TRANSLATION GPU faults.
# Install to ~/.config/environment.d/95-webkit-gpu-shm.conf
WEBKIT_DISABLE_COMPOSITING_MODE=0
WEBKIT_DMABUF_RENDERER_FORCE_SHM=1
