# Protect active desktop working set from premature MGLRU eviction (1000ms)
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
# Relax Adreno 650 GPU runtime autosuspend from 66ms to 500ms to reduce cold-wakeup frame drops
w /sys/devices/platform/soc@0/3d00000.gpu/power/autosuspend_delay_ms - - - - 500
# Keep stock big/prime min_freq (710M/844M) since scx_cosmos manages cpuperf dynamically
# (If running native EEVDF without sched_ext, see docs/scheduler-benchmarks.md)
w /sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq - - - - 710400
w /sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq - - - - 844800
