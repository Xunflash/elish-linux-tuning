# Xiaomi Mi Pad 5 Pro (elish) CS35L41 TDM slot width is 16-bit and q6asm-dai
# rejects S24_32LE with ASoC error (-22) / DSP error[1]. Force S16LE @ 48kHz.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output\\.platform-sound\\..*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
